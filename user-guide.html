<!-- user-guide.html — in-app menu for the User Guide tile.
     Content is generated from assets/English Version + assets/Hindi Version
     by scripts/build-user-guide.js into user-guide-data.js. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Guide — NITI TARA</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4);
      }

      html,
      body {
        height: 100vh;
        background: radial-gradient(
          circle at 50% 0%,
          #14306b 0%,
          #0a1a3c 55%,
          #050b1d 100%
        );
        background-repeat: repeat-y;
        color: #f1f1f1;
        font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 24px 60px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      header .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header .brand img {
        height: 56px;
      }
      header h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.5px;
      }
      .btn {
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 15px;
        margin-left: 8px;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .btn:active {
        transform: scale(0.97);
      }
      h2.section {
        font-size: 16px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #9fc0ff;
        margin: 26px 0 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
      }
      .card {
        cursor: pointer;
        text-align: left;
        padding: 18px 20px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 16px;
        line-height: 1.35;
        transition:
          background 0.15s ease,
          transform 0.1s ease,
          border-color 0.15s ease;
      }
      .card:hover {
        background: rgba(80, 140, 255, 0.25);
        border-color: rgba(120, 170, 255, 0.6);
        transform: translateY(-2px);
      }
      .card .tag {
        display: block;
        font-size: 12px;
        color: #9fc0ff;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .crumbs {
        color: #9fc0ff;
        font-size: 14px;
        margin-bottom: 6px;
      }
      .empty {
        opacity: 0.6;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <img src="images/logo.png" alt="NITI TARA" />
          <h1>User Guide</h1>
        </div>
        <div>
          <button class="btn" id="backBtn" style="display: none">
            &larr; Back
          </button>
          <button class="btn" id="homeBtn">&#8962; Home</button>
        </div>
      </header>
      <main id="view"></main>
    </div>

    <script src="user-guide-data.js"></script>
    <script>
      var U = window.USER_GUIDE || {
        trainingGuide: null,
        sop: null,
        videos: { english: [], hindi: [] },
      };
      var view = document.getElementById("view");
      var backBtn = document.getElementById("backBtn");

      // Simple back-stack: each entry is a render function.
      var stack = [];

      function openDoc(rel) {
        if (window.kiosk) window.kiosk.openDoc(rel);
      }

      function el(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      }

      function card(tag, title, onClick) {
        var c = el("div", "card");
        c.innerHTML =
          '<span class="tag">' +
          escapeHtml(tag) +
          "</span>" +
          escapeHtml(title);
        c.addEventListener("click", onClick);
        return c;
      }

      function go(renderFn) {
        stack.push(renderFn);
        backBtn.style.display = stack.length > 1 ? "inline-block" : "none";
        view.innerHTML = "";
        renderFn();
      }

      function back() {
        if (stack.length <= 1) return;
        stack.pop();
        backBtn.style.display = stack.length > 1 ? "inline-block" : "none";
        view.innerHTML = "";
        stack[stack.length - 1]();
      }

      // ----- Level 1: home (Training Guide | Self Learning Videos) -----
      function renderHome() {
        view.appendChild(el("h2", "section", "Resources"));
        var g = el("div", "grid");

        if (U.trainingGuide) {
          g.appendChild(
            card("PDF", U.trainingGuide.title, function () {
              openDoc(U.trainingGuide.rel);
            }),
          );
        }
        if (U.sop) {
          g.appendChild(
            card("PDF", U.sop.title, function () {
              openDoc(U.sop.rel);
            }),
          );
        }
        g.appendChild(
          card("Folder", "Self Learning Videos", function () {
            go(renderLanguages);
          }),
        );
        view.appendChild(g);
      }

      // ----- Level 2: English | Hindi -----
      function renderLanguages() {
        view.appendChild(el("div", "crumbs", "Self Learning Videos"));
        view.appendChild(el("h2", "section", "Choose a language"));
        var g = el("div", "grid");

        var en = U.videos.english.length;
        var hi = U.videos.hindi.length;

        g.appendChild(
          card(
            en + " video" + (en === 1 ? "" : "s"),
            "English Version",
            function () {
              go(function () {
                renderVideos("English Version", U.videos.english);
              });
            },
          ),
        );
        g.appendChild(
          card(
            hi + " video" + (hi === 1 ? "" : "s"),
            "Hindi Version",
            function () {
              go(function () {
                renderVideos("Hindi Version", U.videos.hindi);
              });
            },
          ),
        );
        view.appendChild(g);
      }

      // ----- Level 3: video list for a language -----
      function renderVideos(label, list) {
        view.appendChild(
          el(
            "div",
            "crumbs",
            "Self Learning Videos &rsaquo; " + escapeHtml(label),
          ),
        );
        view.appendChild(el("h2", "section", "Videos"));
        if (!list.length) {
          view.appendChild(el("p", "empty", "No videos in this folder."));
          return;
        }
        var g = el("div", "grid");
        list.forEach(function (v) {
          g.appendChild(
            card("Video", v.title, function () {
              openDoc(v.rel);
            }),
          );
        });
        view.appendChild(g);
      }

      backBtn.addEventListener("click", back);
      document.getElementById("homeBtn").addEventListener("click", function () {
        window.location.href = "index.html";
      });

      go(renderHome);
    </script>
  </body>
</html>
