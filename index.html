<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NITI TARA</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <video autoplay muted playsinline loop id="myVideo">
      <source src="images/bg-video.mp4" type="video/mp4" />
    </video>
    <div class="content">
      <div
        class="d-flex flex-row justify-content-between align-items-center px-4 mt-5"
      >
        <div class="user_guide">
          <a href="user-guide.html" class="image-swap">
            <img
              src="images/User_Guide (1).png"
              style="height: 75px; width: 75px"
            />
          </a>
        </div>
        <div class="logo">
          <img src="images/logo.svg" alt="Logo" />
        </div>
        <div class="feedback">
          <a href="#" id="openFeedbackMenu" class="image-swap" aria-haspopup="true" aria-expanded="false">
            <img src="images/Feedback (1).png" alt="Support" style="height: 75px; width: 75px"/>
          </a>
          <div class="feedback-menu" id="feedbackMenu" role="menu">
            <a href="https://schoolnetindia.com/niti-tara-feedback" class="feedback-menu-item" role="menuitem">
              Feedback
            </a>
            <a href="#" id="openContactModal" class="feedback-menu-item" role="menuitem">
              Contact Support
            </a>
          </div>
        </div>
      </div>
      <div class="logo_box">
        <ul>
          <li>
            <a href="resources.html" class="image-swap">
              <img src="images/1_img.svg" class="img-normal" alt="" />
              <img src="images/1_imgH.svg" class="img-hover" alt="" />
            </a>
          </li>
          <li>
            <a
              href="https://nitiforstates.gov.in/"
              target="_blank"
              class="image-swap"
            >
              <img src="images/2_Img.svg" class="img-normal" alt="" />
              <img src="images/2_ImgH.svg" class="img-hover" alt="" />
            </a>
          </li>
          <li>
            <a
              href="https://niti.pmgatishakti.gov.in/NitiIndia/login"
              target="_blank"
              class="image-swap"
            >
              <img src="images/3_Img.svg" class="img-normal" alt="" />
              <img src="images/3_ImgH.svg" class="img-hover" alt="" />
            </a>
          </li>
          <li>
            <a
              href="https://vbsr.nitiforstates.gov.in/"
              target="_blank"
              class="image-swap"
            >
              <img src="images/4_Img.svg" class="img-normal" alt="" />
              <img src="images/4_ImgH.svg" class="img-hover" alt="" />
            </a>
          </li>
        </ul>
      </div>
      <div class="logo_box">
        <ul>
          <li>
            <a
              href="https://abp.championsofchange.gov.in/data#?tab=blockprofile&state=all&district=all"
              target="_blank"
              class="image-swap"
            >
              <img src="images/5_Img.svg" class="img-normal" alt="" />
              <img src="images/5_ImgH.svg" class="img-hover" alt="" />
            </a>
          </li>
          <li>
            <a href="#" id="openBhasiniSmritiLogo" class="image-swap">
              <img src="images/6_Img.svg" class="img-normal" alt="" />
              <img src="images/6_ImgH.svg" class="img-hover" alt="" />
            </a>
          </li>
          <li>
            <a
              href="https://championsofchange.gov.in/"
              target="_blank"
              class="image-swap"
            >
              <img src="images/7_Img.svg" class="img-normal" alt="" />
              <img src="images/7_ImgH.svg" class="img-hover" alt="" />
            </a>
          </li>
        </ul>
      </div>
      <div
        class="d-flex flex-row justify-content-between align-items-center px-4"
      >
        <div class="poweroff">
          <a href="#"><img src="images/power_off.png" alt="" /></a>
        </div>
        <div class="desktop">
          <a href="#" id="showDesktopBtn">Desktop</a>
        </div>
      </div>
    </div>

    <!-- Shutdown confirmation modal (Bootstrap 4) -->
    <div
      class="modal fade"
      id="shutdownModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="shutdownModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
          <div
            class="modal-body d-flex flex-column align-items-center justify-content-center text-center"
            style="padding: 30px"
          >
            <img
              src="images/power-black.png"
              alt=""
              style="width: 72px; margin-bottom: 25px"
            />
            <h4 id="shutdownModalLabel" style="margin-bottom: 12px">
              Shutdown NITI TARA?
            </h4>
            <p style="color: #666; margin-bottom: 28px">
              Are you sure you want to shut down the <br>NITI TARA now?
            </p>
            <div>
              <button
                type="button"
                class="btn btn-secondary"
                data-dismiss="modal"
                style="min-width: 110px; margin-right: 10px"
              >
                No
              </button>
              <button
                type="button"
                class="btn btn-danger"
                id="confirmShutdownBtn"
                style="min-width: 110px"
              >
                Yes, shutdown
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contact Support modal (Bootstrap 4). Opened from the Feedback icon's
         dropdown menu. -->
    <div
      class="modal fade"
      id="contactModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="contactModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content contact-modal-content">
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
          <div class="modal-body" style="padding: 32px 34px 28px">
            <h4 id="contactModalLabel" class="contact-title">Contact Support</h4>
            <div class="contact-row">
              <div class="contact-label">Toll-Free</div>
              <div class="contact-value">1800-180-8800</div>
            </div>
            <div class="contact-row">
              <div class="contact-label">WhatsApp</div>
              <div class="contact-value">+91 74286-94964</div>
            </div>
            <div class="contact-row">
              <div class="contact-label">Email</div>
              <div class="contact-value">kyan.support@schoolnetindia.com</div>
            </div>
            <div class="contact-actions">
              <button
                type="button"
                class="btn btn-secondary"
                data-dismiss="modal"
                style="min-width: 110px"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bhasini Smriti launch loader -->
    <div id="bhasiniLoader" class="kiosk-loader-overlay" aria-hidden="true">
      <div class="kiosk-loader-spinner"></div>
      <div class="kiosk-loader-text">Launching Bhasini Smriti…</div>
    </div>

    <!-- Auto-update notice. Hidden until main signals an update is downloaded
         and ready. Informational only: a maintainer applies it with the
         maintenance combo Ctrl+Alt+Shift+U. -->
    <div id="updateToast" class="kiosk-update-toast" aria-hidden="true">
      <span id="updateToastText"></span>
    </div>

    <!-- Bootstrap core JS-->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
